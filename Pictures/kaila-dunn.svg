<svg xmlns="http://www.w3.org/2000/svg" width="600" height="600" viewBox="0 0 600 600">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#111111"/>
      <stop offset="100%" stop-color="#3a3a3a"/>
    </linearGradient>
    <linearGradient id="shirt" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#f4661b"/>
      <stop offset="100%" stop-color="#cf5a12"/>
    </linearGradient>
  </defs>

  <rect width="600" height="600" fill="url(#bg)"/>

  <!-- head -->
  <circle cx="300" cy="250" r="115" fill="#e8b99a"/>
  <circle cx="300" cy="250" r="115" fill="none" stroke="#ffffff" stroke-width="3"/>

  <!-- hair -->
  <path d="M205 175 Q300 135 395 175 Q360 245 300 258 L300 258 Q240 250 205 175 Z"
        fill="#2b2b2b"/>

  <!-- eyes -->
  <ellipse cx="262" cy="248" rx="13" ry="16" fill="#ffffff"/>
  <ellipse cx="338" cy="248" rx="13" ry="16" fill="#ffffff"/>
  <circle cx="266" cy="251" r="7" fill="#7a4a2b"/>
  <circle cx="334" cy="251" r="7" fill="#7a4a2b"/>
  <circle cx="269" cy="248" r="2.5" fill="#ffffff"/>
  <circle cx="337" cy="248" r="2.5" fill="#ffffff"/>

  <!-- smile -->
  <path d="M282 288 Q300 296 318 288" fill="none" stroke="#7a4a2b" stroke-width="4" stroke-linecap="round"/>

  <!-- shirt -->
  <path d="M180 380 L420 380 Q300 560 300 560 L420 380 Z" fill="url(#shirt)"/>
  <path d="M300 500 L300 560" stroke="#ffffff" stroke-width="6" stroke-linecap="round"/>

  <!-- big orange circle (Hopper/Ghosts nod) -->
  <circle cx="150" cy="520" r="34" fill="#f4661b" opacity="0.9"/>
  <circle cx="450" cy="520" r="34" fill="#f4661b" opacity="0.9"/>
</svg>